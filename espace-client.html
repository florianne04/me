<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace client - MONTROVIA</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="espace-section">
    <div class="espace-container">
      <div class="espace-tabs">
        <button class="tab-btn active" data-tab="login">Se connecter</button>
        <button class="tab-btn" data-tab="signup">S'inscrire</button>
      </div>
      <div class="espace-forms">
        <div class="espace-form active" id="login-form">
          <h2>Connexion</h2>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="vous@exemple.com" required />
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="login-password" placeholder="••••••••" required />
          </div>
          <button class="btn btn-primary" id="btn-login">Se connecter</button>
          <div class="espace-links"><a href="#" class="espace-link" data-switch="signup">Créer un compte</a></div>
        </div>
        <div class="espace-form" id="signup-form">
          <h2>Inscription</h2>
          <div class="form-group">
            <label>Nom complet</label>
            <input type="text" id="signup-name" placeholder="Jean Dupont" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email" placeholder="vous@exemple.com" required />
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="signup-password" placeholder="••••••••" required />
          </div>
          <button class="btn btn-primary" id="btn-signup">Créer le compte</button>
          <div class="espace-links"><a href="#" class="espace-link" data-switch="login">J'ai déjà un compte</a></div>
        </div>
      </div>
    </div>

    <script>
      const tabs = document.querySelectorAll('.tab-btn');
      const forms = { login: document.getElementById('login-form'), signup: document.getElementById('signup-form') };
      tabs.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
      document.querySelectorAll('[data-switch]')?.forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); switchTab(a.dataset.switch); }));
      function switchTab(name) { tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === name)); Object.values(forms).forEach(f => f.classList.remove('active')); forms[name].classList.add('active'); }

      const next = new URLSearchParams(location.search).get('next');
      function redirectAfterAuth() {
        const to = next === 'add-to-cart' || next === 'checkout' ? 'index.html' : 'index.html';
        location.href = to;
      }

      function setUser(user) { localStorage.setItem('mt-user', JSON.stringify(user)); }

      document.getElementById('btn-signup').addEventListener('click', () => {
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const pwd = document.getElementById('signup-password').value.trim();
        if (!name || !email || !pwd) { alert('Veuillez remplir tous les champs'); return; }
        setUser({ name, email });
        alert('Compte créé avec succès');
        redirectAfterAuth();
      });

      document.getElementById('btn-login').addEventListener('click', () => {
        const email = document.getElementById('login-email').value.trim();
        const pwd = document.getElementById('login-password').value.trim();
        if (!email || !pwd) { alert('Veuillez renseigner vos identifiants'); return; }
        setUser({ email });
        alert('Connexion réussie');
        redirectAfterAuth();
      });
    </script>
  </body>
  </html>
